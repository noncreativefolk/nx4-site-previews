<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVA — Reserve & Menus</title><style>html,body{margin:0;background:#0a0a0a;color:#666;font:13px/1.6 sans-serif}#p{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.3em}</style></head><body><div id="p">LOADING</div><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>
(function(){
function fail(m){document.getElementById('p').textContent=m}
fetch('data/nava.txt').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){
if(typeof pako==='undefined')throw new Error('decoder unavailable');
var bin=atob(t.replace(/\s/g,'')),bytes=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
var html=pako.ungzip(bytes,{to:'string'});
document.open();document.write(html);document.close();
}).catch(function(e){fail('PREVIEW FAILED TO LOAD — PLEASE REFRESH');console.error(e)});
})();
</script></body></html>
